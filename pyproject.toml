[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "serlekan-sera"
version = "0.4.0"
description = "SERA: a token-efficient Specify, Execute, Review, Accept protocol for multi-model software delivery."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Serlekan"}]
keywords = ["ai-agents", "codex", "claude-code", "software-engineering", "token-efficiency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
sera = "sera.cli:main"
serlekan = "sera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
